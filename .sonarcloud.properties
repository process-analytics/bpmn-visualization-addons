# Read by SonarQube Cloud automatic analysis, which is the mode this project uses. Automatic analysis ignores
# `sonar-project.properties`, so this is the only file that applies.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
#
# `tools/` holds the TypeScript probes that back the plugin system analysis. They deliberately contain type errors and
# near-identical files, which are the measurement rather than a defect, and they are compiled by their own tsconfig
# files rather than by any package. ESLint ignores them for the same reason, see the `ignores` entry in
# `eslint.config.mjs`.
sonar.exclusions=tools/**
sonar.cpd.exclusions=tools/**
